<!--
THESIS: a rodada do filme é UMA linha de metrô atravessando as fases; recusa o
dashboard-de-nós dark com acento neon que a categoria sempre entrega.
OWN-WORLD: sinalização de metrô à noite - preto de placa, Helvetica, bullets
numerados na cor da linha (azul), casing vazado p/ trecho futuro, chips de status
de serviço (âmbar/vermelho/roxo), quadro "ATUALIZAÇÕES DE SERVIÇO".
STORY: o diretor bate o olho, acha o trem (fase atual pulsando), vê disrupção
em vermelho antes de qualquer outra coisa, e o custo na régua; visitante do repo
entende o método como uma jornada com estações e baldeações.
FIRST VIEWPORT: banda de sinalização no topo (linha, VOCÊ ESTÁ AQUI, régua de
custo, frescor), diagrama da linha dominando o centro, quadro de serviço à direita.
FORM: direção 6 da lista fundamentada (seed 6cb3d033, escolha do usuário);
staging nativo do mundo (quadro de serviço), stagings sorteados recusados.
-->

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{

  .legenda{align-self:flex-start;margin:0 22px 20px;display:flex;
    flex-wrap:wrap;gap:.3rem .85rem;align-items:center;max-width:calc(100% - 44px);

  .parada.planejado .rotulo-parada,.parada.descartado .rotulo-parada{color:var(--dim)}

  /* trilhos */
  .trilho-casing{fill:none;stroke:var(--casing);stroke-width:9}
  .trilho-miolo{fill:none;stroke:var(--chao);stroke-width:5}

    stroke-dasharray:7 16;animation:trem-anda 1.6s linear infinite}
  .ramal-feito{stroke-width:4.5}
  .ramal-casing{stroke-width:6.5}
  .ramal-miolo{stroke-width:3}
  .cruza-trilho{fill:none;stroke:var(--chao);stroke-width:11}
  .cruza-ramal{fill:none;stroke:var(--chao);stroke-width:8}
  @keyframes trem-anda{to{stroke-dashoffset:-23}}

  .react-flow__handle{opacity:0;width:1px;height:1px;min-width:0;min-height:0;

<body>
<div id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { ReactFlow, Handle, Position, getSmoothStepPath } from "@xyflow/react";
const h = React.createElement;

// Espinha do fluxograma v2 (docs/ESTRUTURA.md). Mudou o workflow? Atualizar AQUI.
const FASES = [
  { id: "1",   titulo: "Brief" },
  { id: "1.5", titulo: "Conceito", gate: true },
  { id: "2",   titulo: "Setup + preflight" },
  { id: "3",   titulo: "Âncoras", gate: true },
  { id: "4",   titulo: "Storyboard", gate: true },
  { id: "5",   titulo: "Wow-shot", gate: true },
  { id: "6",   titulo: "Produção" },
  { id: "7",   titulo: "Montagem + review 7b", gate: true },
  { id: "8",   titulo: "Áudio + review 8b" },
  { id: "9",   titulo: "Finalização", gate: true },
  { id: "10",  titulo: "Registro" },
];
// só estados de MOVIMENTO animam o trecho; gate/bloqueada são trem parado
const EM_MOVIMENTO = ["em_andamento", "validando"];
const CHIP_FASE = {
  validando:    { classe: "validacao", texto: "validando" },
  gate_usuario: { classe: "aviso",     texto: "aguardando você" },
  bloqueada:    { classe: "erro",      texto: "⚠ suspensa" },
};
const CHIP_EVENTO = {
  fase: "linha", gate: "aviso", job: "linha", veredito: "validacao",
  retake: "aviso", qc: "cinza", audio: "cinza", erro: "erro",
};
const FRESCOR_MS = 3 * 60 * 1000;   // board sem escrita há 3 min = congelado
const CONEXAO_MS = 5 * 1000;        // sem fetch ok há 5 s = server fora
const numero = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 });

function idadeTexto(ms) {
  if (!Number.isFinite(ms)) return "há ? (timestamp inválido)";
  const s = Math.round(ms / 1000);
  if (s < 120) return "há " + s + "s";
  if (s < 7200) return "há " + Math.round(s / 60) + "min";
  return "há " + Math.round(s / 3600) + "h";
}

// último nível de evento por ref: pinta a estação/parada de vermelho se "erro"
function nivelPorRef(eventos) {
  const m = {};
  for (const ev of eventos || []) if (ev.ref) m[ev.ref] = ev.nivel;
  return m;
}

/* ── nós ─────────────────────────────────────────────────────────── */

// a linha passa pelo CENTRO do bullet (30px), nunca pelo centro do nó com label
const meio = (x, y) => ({ left: x + "px", top: y + "px", transform: "none" });

function EstacaoNode({ data }) {
  const hz = data.horizontal;
  const cls = ["estacao", data.status, data.erro && "erro", data.fase.gate && "gate",
    hz && "deitada"].filter(Boolean).join(" ");
  const chip = data.erro ? h("span", { className: "chip erro" }, "⚠ erro") :
    CHIP_FASE[data.status] ? h("span", { className: "chip " + CHIP_FASE[data.status].classe },
      CHIP_FASE[data.status].texto) : null;
  const tag = data.status === "em_andamento" &&
    h("span", { className: "aqui-tag" }, "● você está aqui");
  return h("div", { className: cls },
    h(Handle, { type: "target", position: hz ? Position.Left : Position.Top,
      style: hz ? meio(0, 15) : meio(15, 0) }),
    h(Handle, { type: "source", position: hz ? Position.Right : Position.Bottom,
      style: hz ? meio(30, 15) : meio(15, 30) }),
    h(Handle, { type: "source", id: "ramal",
      position: hz ? Position.Bottom : Position.Right,
      style: hz ? meio(15, 30) : meio(30, 15) }),
    h("div", { className: "bullet" },
      data.status === "em_andamento" && h("span", { className: "halo" }),
      data.fase.id),
    hz
      ? h(React.Fragment, null,
          h("div", { className: "infos" }, h("span", { className: "nome" }, data.fase.titulo)),
          (tag || chip) && h("div", { className: "anota" }, tag, chip))
      : h("div", { className: "infos" }, tag,
          h("span", { className: "nome" }, data.fase.titulo), chip));
}

function ParadaNode({ data }) {
  const cls = ["parada", data.status, data.erro && "erro"].filter(Boolean).join(" ");
  const custo = data.shot.custo_cr ? " · " + numero.format(data.shot.custo_cr) + " cr" : "";
  return h("div", { className: cls },
    h(Handle, { type: "target", position: data.horizontal ? Position.Top : Position.Left,
      style: data.horizontal ? meio(7, 0) : meio(0, 10) }),
    h("div", { className: "ponto" },
      data.status === "gerando" && h("span", { className: "halo" })),
    h("span", { className: "rotulo-parada" },
      data.shot.id + " v" + (data.shot.versao || 1),
      h("span", { className: "custo" }, custo)));
}

/* ── trilhos (arestas) ───────────────────────────────────────────── */

function TrilhoEdge(props) {
  const [path] = getSmoothStepPath({
    sourceX: props.sourceX, sourceY: props.sourceY, sourcePosition: props.sourcePosition,
    targetX: props.targetX, targetY: props.targetY, targetPosition: props.targetPosition,
    borderRadius: 26,
  });
  const d = props.data || {};
  const ram = d.ramal ? "ramal-" : "";
  if (d.estado === "pendente")
    return h("g", null,
      h("path", { d: path, className: "trilho-casing " + ram + "casing" }),
      h("path", { d: path, className: "trilho-miolo " + ram + "miolo" }));
  return h("g", null,
    h("path", { d: path, className: d.ramal ? "cruza-ramal" : "cruza-trilho" }),
    h("path", { d: path, className: "trilho-feito " + ram + "feito" }),
    d.estado === "ativo" ? h("path", { d: path, className: "trilho-trem" }) : null);
}

const nodeTypes = { estacao: EstacaoNode, parada: ParadaNode };
const edgeTypes = { trilho: TrilhoEdge };

/* ── layout: mapa de bolso (vertical) ou strip map (horizontal) ──── */

function buildGraph(estado, horizontal) {
  const nodes = [], edges = [];
  const ultimoNivel = nivelPorRef(estado.eventos);
  const porFase = {};
  for (const s of estado.shots || []) (porFase[s.fase] ||= []).push(s);
  let pos = 0;
  FASES.forEach((f, i) => {
    const st = (estado.fases || {})[f.id] || "pendente";
    const erro = ultimoNivel[f.id] === "erro";
    const shots = porFase[f.id] || [];
    nodes.push({ id: "f" + f.id, type: "estacao",
      position: horizontal ? { x: pos, y: 0 } : { x: 0, y: pos },
      data: { fase: f, status: st, erro, horizontal } });
    if (i > 0) {
      const stAnt = (estado.fases || {})[FASES[i - 1].id] || "pendente";
      const percorrido = stAnt === "concluida" || stAnt === "pulada";
      edges.push({ id: "e" + i, source: "f" + FASES[i - 1].id, target: "f" + f.id,
        type: "trilho",
        data: { estado: !percorrido ? "pendente" : EM_MOVIMENTO.includes(st) ? "ativo" : "feito" } });
    }
    shots.forEach((s, j) => {
      const sErro = ultimoNivel[s.id] === "erro";
      nodes.push({ id: "s" + s.id, type: "parada",
        position: horizontal
          ? { x: pos + 48 + j * 22, y: 86 + j * 52 }
          : { x: 320, y: pos + 26 + j * 54 },
        data: { shot: s, status: s.status, erro: sErro, horizontal } });
      edges.push({ id: "es" + s.id, source: "f" + f.id, sourceHandle: "ramal",
        target: "s" + s.id, type: "trilho",
        data: { ramal: true,
          estado: s.status === "planejado" ? "pendente" :
                  s.status === "gerando" ? "ativo" : "feito" } });
    });
    pos += horizontal
      ? Math.max(150, 96 + shots.length * 24)
      : Math.max(96, shots.length * 54 + 56);
  });
  return { nodes, edges };
}

/* ── banda, faixas e quadro ──────────────────────────────────────── */

function Banda({ estado, ultimoOk }) {
  const { gasto_cr = 0, teto_cr = 0 } = estado.custos || {};
  const pct = teto_cr ? Math.min(100, 100 * gasto_cr / teto_cr) : 0;
  const ts = Date.parse(estado.atualizado_em);
  const idadeEstado = Number.isNaN(ts) ? Infinity : Date.now() - ts;
  const semConexao = Date.now() - ultimoOk > CONEXAO_MS;
  const atual = FASES.find(f => f.id === String(estado.fase_atual));
  const inicial = (estado.filme || "?").charAt(0).toUpperCase();
  const bloqueios = Object.values(nivelPorRef(estado.eventos))
    .filter(n => n === "erro").length;
  return h(React.Fragment, null,
    h("header", { className: "banda" },
      h("div", { className: "rota" },
        h("span", { className: "bullet-linha" }, inicial),
        h("span", { className: "nome-linha" }, "Linha " + (estado.filme || "?"))),
      h("div", { className: "aqui" },
        h("div", { className: "rotulo" }, "Você está aqui"),
        h("div", { className: "estacao-atual" },
          atual ? "Estação " + atual.id + " · " + atual.titulo : "fase " + (estado.fase_atual || "?"))),
      h("div", { className: "regua" },
        h("div", { className: "rotulo" },
          h("span", null, "Créditos"),
          h("span", { className: "valor" },
            numero.format(gasto_cr) + " / " + numero.format(teto_cr) + " cr")),
        h("div", { className: "trilho-regua" },
          h("div", { className: "base" }),
          h("div", { className: "cheio" + (gasto_cr > teto_cr ? " estourou" : pct >= 85 ? " perto" : ""),
            style: { transform: "scaleX(" + pct / 100 + ")" } }),
          Array.from({ length: 9 }, (_, i) =>
            h("span", { className: "tick", key: i, style: { left: (i + 1) * 10 + "%" } })))),
      h("span", { className: "frescor" }, "atualizado " + idadeTexto(idadeEstado))),
    bloqueios > 0 && h("div", { className: "faixa interrupcao" },
      h("span", { className: "sinal" }, "⚠"),
      "Interrupção na linha · " + bloqueios +
        (bloqueios === 1 ? " ponto" : " pontos") + " com bloqueio ",
      h("small", null, "· vermelho no mapa: o último evento do ponto é erro")),
    semConexao && h("div", { className: "faixa desconectado" },
      h("span", { className: "sinal" }, "⚠"),
      "Sem conexão com o server ",
      h("small", null, "· o serve.sh caiu? Continuo tentando reconectar.")),
    !semConexao && idadeEstado > FRESCOR_MS &&
      h("div", { className: "faixa congelado" },
        h("span", { className: "sinal" }, "⚠"),
        "Linha sem reporte há mais de 3 min ",
        h("small", null, "· estado.json parou de ser escrito - board possivelmente congelado.")));
}

function Quadro({ eventos }) {
  const itens = [...(eventos || [])].reverse().slice(0, 50);
  return h("aside", { className: "quadro" },
    h("h2", null, "Atualizações de serviço"),
    h("div", { className: "rolagem" },
      itens.length === 0
        ? h("div", { className: "vazio" }, "Sem atualizações - linha em operação normal.")
        : itens.map(ev =>
            h("div", { className: "atualizacao" + (ev.nivel === "erro" ? " erro" : ""),
              key: (ev.t || "") + (ev.tipo || "") + (ev.msg || "") },
              h("div", { className: "meta" },
                h("span", { className: "hora" },
                  (d => Number.isNaN(d.getTime()) ? "??:??:??" : d.toTimeString().slice(0, 8))(new Date(ev.t))),
                h("span", { className: "chip " + (ev.nivel === "erro" ? "erro" : CHIP_EVENTO[ev.tipo] || "cinza") },
                  (ev.tipo || "?") + (ev.ref ? " · " + ev.ref : "")),
                ev.custo_cr ? h("span", { className: "hora" }, numero.format(ev.custo_cr) + " cr") : null),
              h("div", { className: "msg" }, ev.msg)))));
}

function Legenda() {
  return h("div", { className: "legenda", "aria-label": "Legenda do diagrama" },
    h("span", { className: "item" }, h("span", { className: "simb gate" }), "baldeação = gate"),
    h("span", { className: "item" }, h("span", { className: "simb-x" }, "✕"), "fechada = pulada"),
    h("span", { className: "item" }, h("span", { className: "simb construir" }), "a construir"),
    h("span", { className: "item" }, h("span", { className: "simb trem" }), "trem em movimento"),
    h("span", { className: "item" }, h("span", { className: "simb validacao" }), "validando"),
    h("span", { className: "item" }, h("span", { className: "simb aviso" }), "aguardando você"),
    h("span", { className: "item" }, h("span", { className: "simb erro" }), "bloqueio/erro"),
    h("span", { className: "item" }, h("span", { className: "simb aprovado" }), "aprovado"));
}

/* ── app ─────────────────────────────────────────────────────────── */

function App() {
  const [estado, setEstado] = React.useState(null);
  const [ultimoOk, setUltimoOk] = React.useState(0);
  const [largo, setLargo] = React.useState(() => matchMedia("(min-width: 1100px)").matches);
  const filme = new URLSearchParams(location.search).get("filme");
  React.useEffect(() => {
    const m = matchMedia("(min-width: 1100px)");
    const f = e => setLargo(e.matches);
    m.addEventListener("change", f);
    return () => m.removeEventListener("change", f);
  }, []);
  React.useEffect(() => {
    if (!filme) return;
    let vivo = true;
    const tick = () =>
      fetch("/" + filme + "/estado.json?t=" + Date.now())
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(j => { if (vivo) { setEstado(j); setUltimoOk(Date.now()); } })
        .catch(() => {});   // JSON parcial/server fora: mantém último estado bom
    tick();
    const id = setInterval(tick, 1000);
    return () => { vivo = false; clearInterval(id); };
  }, [filme]);
  // relógio de parede: banners e frescor precisam re-renderizar mesmo sem poll ok
  const [, forcar] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => forcar(n => n + 1), 1000);
    return () => clearInterval(id);
  }, []);
  if (!filme) return h("div", { className: "aviso-tela" },
    h("h1", null, "Linha não informada"),
    h("p", null, "Abra com ", h("code", null, "?filme=<slug>"), " na URL - o ",
      h("code", null, "tools/viz/serve.sh <slug>"), " imprime o endereço completo."));
  if (!estado) return h("div", { className: "aviso-tela" },
    h("h1", null, "Aguardando composição"),
    h("p", null, "O ", h("code", null, "estado.json"), " desta linha ainda não foi publicado. ",
      "Rode o ", h("code", null, "/novo-video"), " (a fase 2 cria o arquivo) ou o simulador: ",
      h("code", null, "bash tools/viz/demo/simular.sh"), "."));
  const { nodes, edges } = buildGraph(estado, largo);
  return h("div", { className: "app" },
    h(Banda, { estado, ultimoOk }),
    h("div", { className: "corpo" },
      h("div", { className: "mapa" },
        h("div", { className: "fluxo" },
          h(ReactFlow, { key: largo ? "strip" : "bolso", nodes, edges, nodeTypes, edgeTypes,
            fitView: true, fitViewOptions: { padding: 0.12 },
            proOptions: { hideAttribution: true },
            nodesDraggable: false, nodesConnectable: false, elementsSelectable: false })),
        h(Legenda)),
      h(Quadro, { eventos: estado.eventos })));
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
